<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>FF OB55 · Headshot Panel</title>
<meta name="theme-color" content="#080b09" />
<style>
  :root{
    --bg:#080b09; --card:#0f1512; --line:#1d2a22;
    --green:#2bff88; --orange:#ff8a2b;
    --txt:#e8fff2; --muted:#7d9b8a; --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 520px at 50% -12%,#10251a 0%,transparent 62%),
      linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 44px,
      linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/44px 100%,
      var(--bg);
    color:var(--txt);min-height:100vh;padding:26px 16px 70px;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:470px}
  .badge{
    display:inline-block;font-size:11px;letter-spacing:2px;font-weight:700;
    color:var(--orange);border:1px solid #4a2c10;background:#1a1006;
    padding:5px 11px;border-radius:99px;margin-bottom:16px;
  }
  h1{font-size:30px;line-height:1.05;margin:0 0 8px;letter-spacing:-.5px}
  h1 span{color:var(--green)}
  .sub{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 26px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  .label{font-size:11px;letter-spacing:1.6px;color:var(--muted);font-weight:700;margin-bottom:10px}
  .chips{display:flex;gap:8px}
  .chip{
    flex:1;text-align:center;padding:11px 4px;border-radius:11px;cursor:pointer;
    border:1px solid var(--line);background:#0b110e;color:var(--muted);
    font-size:11px;font-weight:800;letter-spacing:.6px;transition:.15s;
  }
  .chip.on{border-color:var(--green);color:var(--green);background:#0d1f14}
  .chip small{display:block;font-weight:600;font-size:9px;opacity:.65;margin-top:3px;letter-spacing:0}
  #go{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:linear-gradient(180deg,#39ff92,#17c96a);color:#04140a;
    font-weight:900;font-size:18px;letter-spacing:.5px;
    padding:19px;border-radius:var(--r);margin:6px 0 10px;
    box-shadow:0 10px 34px #2bff8840;
  }
  #go:active{transform:scale(.985)}
  .row{display:flex;gap:10px}
  .btn{
    flex:1;text-align:center;padding:13px;border-radius:12px;cursor:pointer;
    border:1px solid var(--line);background:#0b110e;color:var(--txt);
    font-size:13px;font-weight:700;text-decoration:none;
  }
  .btn:active{background:#131c17}
  pre{
    background:#070a08;border:1px solid var(--line);border-radius:12px;
    padding:13px;font-size:10px;line-height:1.65;overflow-x:auto;
    color:#9fe7bd;margin:0;white-space:pre-wrap;word-break:break-all;
  }
  ol{margin:0;padding-left:19px;color:var(--muted);font-size:13.5px;line-height:1.85}
  ol b{color:var(--txt)}
  .foot{text-align:center;color:#4c6157;font-size:11px;margin-top:24px;line-height:1.6}
  #qrbox{display:none;text-align:center;padding:18px;background:#fff;border-radius:12px;margin-bottom:14px}
  #qrbox img{width:210px;height:210px;display:block;margin:0 auto}
  #qrbox p{color:#111;font-size:11px;margin:10px 0 0;font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <div class="badge">FREE FIRE · OB55 · PACKET TUNING</div>
  <h1
